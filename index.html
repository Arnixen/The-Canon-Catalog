<!DOCTYPE html>
<html>
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timeline</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <div id="franchiseHeadbar" aria-label="Franchise navigation"></div>
    <div id="runtimeCounterRow">
      <div id="runtimeCounter">
        <span class="runtime-label">Total Runtime</span>
        <span class="runtime-value" id="runtimeCounterValue">0m</span>
      </div>
    </div>
    <div style="display: none;">
      <select id="franchiseSelect" aria-hidden="true" tabindex="-1">
        <option value="MCU">Marvel Studios</option>
        <option value="StarWars">Star Wars</option>
        <option value="StarTrek">Star Trek</option>
        <option value="DoctorWho">Doctor Who</option>
        <option value="MiddleEarth">Middle-Earth</option>
        <option value="RiordanVerse">RiordanVerse</option>
        <option value="DCU">DC Studios</option>
        <option value="Zelda">The Legend of Zelda</option>
      </select>
    </div>

    <div style="text-align:center; margin-top: 18px; margin-bottom: 8px;">
      <img id="franchiseLogo" src="images/marvel-studios-logo.png" alt="Franchise Logo" style="max-width: 320px; max-height: 80px; width: auto; height: auto; display: block; margin: 0 auto 8px auto; filter: drop-shadow(0 2px 8px #000b); transition: opacity 0.3s;" />
      <div id="franchiseLogoFallback" style="display: none; margin: 0 auto 8px auto; font-size: 2rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 0 2px 8px #000b;"></div>
      <div id="franchiseUpdatedLabel" class="franchise-updated-label" style="display:block; margin:0 auto 8px auto; color:#fff; font-size:0.95rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; text-shadow:0 1px 4px rgba(0,0,0,0.55); background:rgba(0,0,0,0.6); padding:4px 10px; border-radius:999px; width:max-content;">Last updated: August 4, 2026</div>
    </div>
    <h1></h1>




<div class="filters">
  Types:
  <br>
  <div id="typeCheckboxes" style="display:inline-block;"></div>
  <br>
  <button id="selectAllTypes" style="margin-left: 8px;">Select All</button>
  <button id="deselectAllTypes" style="margin-left: 8px;">Deselect All</button>

  <label id="universeSection" style="margin-left: 16px;">
    <br>
    Universes:
    <br>
    <div id="universeCheckboxes"></div>
    <br>
    <button id="selectAll" style="margin-left: 8px;">Select All</button>
    <button id="deselectAll" style="margin-left: 8px;">Deselect All</button>
  </label>

  <button id="sortButton" style="margin-left: 16px;">Sort by Release Order</button>
  <button id="compactToggle" style="margin-left: 8px;">Compact View</button>
  <button id="episodicToggle" style="margin-left: 8px;">Series Mode</button>
  <input id="cardSearch" type="text" placeholder="Search title or episode title" aria-label="Search cards" autocomplete="off" />
  <div id="checkedStateSection" style="margin-top: 12px;">
    Status:
    <button type="button" class="toggle-btn checked-state-btn selected" data-check-state="all">All</button>
    <button type="button" class="toggle-btn checked-state-btn" data-check-state="checked">Checked</button>
    <button type="button" class="toggle-btn checked-state-btn" data-check-state="unchecked">Unchecked</button>
    <button type="button" id="checkAllCards" style="margin-left: 8px;">Check All</button>
    <button type="button" id="uncheckAllCards" style="margin-left: 8px;">Uncheck All</button>
  </div>
  <br>
  <div id="continuitySection" style="margin-top: 12px; display: none;">
    Continuity:
    <button type="button" class="toggle-btn continuity-btn selected" data-continuity="Canon">Canon</button>
    <button type="button" class="toggle-btn continuity-btn" data-continuity="Legends">Legends</button>
  </div>
  <div id="eraSection" style="margin-top: 12px; display: none;">
    Eras:
    <div id="eraFilters"></div>
  </div>
</div>

<div class="timeline-wrapper">
  <button class="arrow left"><</button>
  <div class="timeline"></div>
  <button class="arrow right">></button>
</div>

<div id="noResults" style="display: none; text-align: center; margin-top: 20px; font-size: 1.2em;">No Content Found</div>

<div class="provider-attribution" aria-label="Data and image attribution">
  <img src="images/TMDB-logo.png" alt="TMDB" />
  <span>Movie and TV Posters are sourced from <a href="https://www.themoviedb.org" target="_blank" rel="noopener noreferrer">TMDB</a></span><br>
  <img src="images/comicvine-logo.png" alt="Comic Vine" />
  <span>Comic covers are sourced from <a href="https://comicvine.gamespot.com" target="_blank" rel="noopener noreferrer">Comic Vine</a>.</span>
  <img src="images/OpenLibraryLogo.png" alt="Open Library" />
  <span>Book covers are sourced from <a href="https://openlibrary.org" target="_blank" rel="noopener noreferrer">Open Library</a>.</span>
</div>

  <script src="app-core.js"></script>
  <script src="app-interactions.js"></script>
  <script src="timeline-state.js"></script>
  <script src="timeline-renderer.js"></script>
  <script src="timeline-controls.js"></script>
  <script src="app-franchise.js"></script>
  <script src="app-data.js"></script>
  <script src="app-workbooks.js"></script>
  <script src="app-bootstrap.js"></script>

  </body>
</html>
